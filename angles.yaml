# FACTOR SELECTION (registered 2026-10-07 before running). User: "see which factors did best in the past and weight from there".
# Factor universe: every numeric FIAM/JKP characteristic (2000-2023). Factor return each month = cap-weighted
# top-tercile minus bottom-tercile return among S&P members (characteristic at prior month end).
# Walk-forward: each month uses ONLY factor returns already realized. Bounded S&P tilt k = 1 + 0.30*s, TE <= 2%.
# Judged on 2005-2015 (first 60m used to start) and 2016-2023 (model never saw it; researcher has seen the era).
# Gate: net excess t >= 3, deflated Sharpe >= 0.95 at the full trial count, positive in both periods.
factor_selection:
  - {id: F1_best5_trailing60, def: "pick the 5 factors with the highest |trailing 60m mean return|, signed by that mean; composite = mean of signed ranks"}
  - {id: F2_best5_trailing12, def: "same with trailing 12m (factor momentum, Gupta-Kelly 2019)"}
  - {id: F3_all_tstat_weighted, def: "all factors, weight = trailing 60m t-stat clipped to [-3, 3] (shrinks toward zero when evidence is weak)"}
